name: Weekly Garmin workout

on:
  schedule:
    - cron: "17 8 * * 0"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the validated workout to Garmin Connect
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-garmin-workout
  cancel-in-progress: false

jobs:
  workout:
    if: ${{ github.event.repository.private && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies and Codex
        run: |
          python -m pip install -r setup/requirements-linux-x86_64-py312.lock
          npm install --prefix "$RUNNER_TEMP/workoutplanner-codex" @openai/codex@0.172.0
          "$RUNNER_TEMP/workoutplanner-codex/node_modules/.bin/codex" --version
          echo "$RUNNER_TEMP/workoutplanner-codex/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Sync, generate, and validate workout
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          ATHLETE_PROFILE_JSON: ${{ secrets.ATHLETE_PROFILE_JSON }}
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          WORKOUTPLANNER_UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: bash setup/weekly-workout.sh
