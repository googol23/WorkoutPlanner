name: Offline CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      FTP_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      ftp_proxy: ""
      PIP_CONFIG_FILE: /dev/null
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install -r setup/requirements-linux-x86_64-py312.lock
          python -m pip check
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Preview the sample workout
        run: python upload_workouts.py running_plan.json --dry-run --schedule
