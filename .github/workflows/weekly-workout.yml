name: Weekly Garmin workout

on:
  schedule:
    - cron: "17 8 * * 0"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the validated workout to Garmin Connect
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-garmin-workout
  cancel-in-progress: false

jobs:
  workout:
    if: ${{ github.event.repository.private && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, linux, workoutplanner-live]
    timeout-minutes: 25
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Sync, generate, and validate workout
        env:
          WORKOUTPLANNER_UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: bash setup/weekly-workout.sh
